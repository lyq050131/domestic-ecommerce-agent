<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>国内电商店铺自动化运营智能体 · 运营后台</title>
<style>
:root{--bg:#f5f7fa;--card:#fff;--border:#e3e8ef;--text:#1f2328;--muted:#57606a;--primary:#1f6feb;--ok:#1a7f37}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(90deg,#1f6feb,#8250df);color:#fff;padding:18px 28px}
header h1{margin:0;font-size:20px}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
main{max-width:1100px;margin:24px auto;padding:0 20px;display:grid;gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px 20px}
.card h2{margin:0 0 12px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
label{font-size:13px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
input[type=text],input[type=number],textarea{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit}
textarea{width:100%;min-height:70px;resize:vertical}
button{background:var(--primary);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-size:14px;cursor:pointer}
button:hover{opacity:.9}
button:disabled{opacity:.5;cursor:not-allowed}
.btn-sm{background:#fff;color:var(--primary);border:1px solid var(--primary);border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.btn-sm:hover{background:#e8f0fe;opacity:1}
pre{background:#0d1117;color:#c9d1d9;border-radius:10px;padding:14px;overflow:auto;white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.6;max-height:560px}
.hidden{display:none}
#statusBar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
#toast{position:fixed;top:16px;right:16px;background:#1f2328;color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;display:none;max-width:420px;z-index:99}
.loading{color:#0969da;font-size:14px;margin:8px 0}
/* Markdown 渲染 */
.md{font-size:14px;line-height:1.75;color:var(--text);background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px 20px;max-height:640px;overflow:auto}
.md h1,.md h2{font-size:18px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid #eaeef2}
.md h3{font-size:15px;margin:12px 0 6px}
.md h4,.md h5,.md h6{font-size:14px;margin:10px 0 4px}
.md p{margin:6px 0}
.md ul,.md ol{margin:6px 0;padding-left:24px}
.md li{margin:3px 0}
.md table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}
.md th,.md td{border:1px solid #d0d7de;padding:6px 10px;text-align:left;vertical-align:top}
.md th{background:#f6f8fa;font-weight:600}
.md code{background:#eff1f3;border-radius:4px;padding:1px 5px;font-size:12px;font-family:Consolas,Menlo,monospace}
.md pre.code{background:#0d1117;color:#c9d1d9;padding:12px 14px;border-radius:8px;overflow:auto;margin:8px 0}
.md pre.code code{background:none;padding:0;color:inherit;font-size:12.5px}
.md blockquote{border-left:3px solid #d0d7de;margin:8px 0;padding:2px 12px;color:var(--muted);background:#fafbfc}
.md hr{border:0;border-top:1px solid #eaeef2;margin:14px 0}
.md a{color:var(--primary)}
.md strong{font-weight:700}
</style>
</head>
<body>
<header>
  <h1>国内电商店铺自动化运营智能体 · 运营后台</h1>
  <p>数据源：淘宝客真实 API ｜ LLM：DeepSeek ｜ 自反馈闭环（RAG + 质量门控 + 向量回流）</p>
</header>
<main>
  <div id="statusBar">
    <span>版本：<span id="stVersion">-</span> ｜ 淘宝配置：<span id="stTbk">-</span> ｜ DeepSeek：<span id="stLLM">-</span></span>
    <a href="/docs" target="_blank" style="color:#1f6feb">API 文档 /docs</a>
  </div>

  <section class="card">
    <h2>📦 选品分析</h2>
    <div class="row">
      <label>品类 <input type="text" id="selCategory" value="无线蓝牙耳机"></label>
      <label>数量 <input type="number" id="selCount" value="20" min="1" max="100" style="width:80px"></label>
      <button id="btnSel">开始分析（约1-2分钟）</button>
    </div>
    <div id="selLoading" class="hidden loading">⏳ 正在抓取淘宝真实数据并生成报告，请稍候…</div>
    <div class="row hidden" id="selExport">
      <button class="btn-sm" id="selMdBtn">⬇ 导出 Markdown</button>
      <button class="btn-sm" id="selHtmlBtn">⬇ 导出 HTML</button>
      <button class="btn-sm" id="selPrintBtn">🖨 打印 / 另存为 PDF</button>
    </div>
    <div class="md hidden" id="selReport"></div>
  </section>

  <section class="card">
    <h2>📈 投放优化</h2>
    <div class="row">
      <label>每词商品数 <input type="number" id="adTopN" value="15" min="1" max="100" style="width:80px"></label>
      <button id="btnAd">开始优化（约1分钟）</button>
    </div>
    <div id="adLoading" class="hidden loading">⏳ 正在抓取 10 个关键词真实数据并生成方案…</div>
    <div class="row hidden" id="adExport">
      <button class="btn-sm" id="adMdBtn">⬇ 导出 Markdown</button>
      <button class="btn-sm" id="adHtmlBtn">⬇ 导出 HTML</button>
      <button class="btn-sm" id="adPrintBtn">🖨 打印 / 另存为 PDF</button>
    </div>
    <div class="md hidden" id="adReport"></div>
  </section>

  <section class="card">
    <h2>💬 多语言客服</h2>
    <div class="row">
      <label>内容 <input type="text" id="csContent" style="width:380px" placeholder="输入评论或私信内容"></label>
      <label>评分(1-5) <input type="number" id="csRating" min="1" max="5" style="width:70px" placeholder="留空=私信"></label>
      <button id="btnCs">生成回复</button>
    </div>
    <div id="csLoading" class="hidden loading">⏳ 正在生成回复…</div>
    <div class="row hidden" id="csExport">
      <button class="btn-sm" id="csMdBtn">⬇ 导出 Markdown</button>
      <button class="btn-sm" id="csHtmlBtn">⬇ 导出 HTML</button>
      <button class="btn-sm" id="csPrintBtn">🖨 打印 / 另存为 PDF</button>
    </div>
    <div class="md hidden" id="csReport"></div>
  </section>

  <section class="card">
    <h2>🔄 自反馈闭环统计</h2>
    <div class="row"><button id="btnLoop">刷新统计</button></div>
    <div id="loopLoading" class="hidden loading">⏳ 正在获取统计…</div>
    <pre id="loopReport" class="hidden"></pre>
  </section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.style.display='block';clearTimeout(t._h);t._h=setTimeout(()=>t.style.display='none',6000);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function inline(s){
  return s
    .replace(/`([^`]+)`/g,(m,c)=>'<code>'+esc(c)+'</code>')
    .replace(/\*\*([^*]+)\*\*/g,(m,c)=>'<strong>'+esc(c)+'</strong>')
    .replace(/\*([^*]+)\*/g,(m,c)=>'<em>'+esc(c)+'</em>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g,(m,t,u)=>'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(t)+'</a>');
}
function mdRender(src){
  const lines=String(src||'').replace(/\r\n/g,'\n').split('\n');
  let html='',i=0,list=[],listType=null;
  const closeList=()=>{
    if(list.length){html+=(listType==='ul'?'<ul>':'<ol>');for(const li of list)html+='<li>'+inline(li)+'</li>';html+=(listType==='ul'?'</ul>':'</ol>');list=[];listType=null;}
  };
  while(i<lines.length){
    const line=lines[i];
    if(/^```/.test(line)){
      closeList();const buf=[];i++;
      while(i<lines.length&&!/^```/.test(lines[i])){buf.push(lines[i]);i++;}
      i++;
      html+='<pre class="code"><code>'+esc(buf.join('\n'))+'</code></pre>';
      continue;
    }
    if(/^#{1,6}\s+/.test(line)){
      closeList();const m=line.match(/^(#{1,6})\s+(.*)$/);const lv=m[1].length;
      html+='<h'+lv+'>'+inline(m[2])+'</h'+lv+'>';i++;continue;
    }
    if(/^\s*[-*]\s+/.test(line)){
      if(listType!=='ul'){closeList();listType='ul';}
      list.push(line.replace(/^\s*[-*]\s+/,''));i++;continue;
    }
    if(/^\s*\d+\.\s+/.test(line)){
      if(listType!=='ol'){closeList();listType='ol';}
      list.push(line.replace(/^\s*\d+\.\s+/,''));i++;continue;
    }
    if(/^>\s?/.test(line)){
      closeList();html+='<blockquote>'+inline(line.replace(/^>\s?/,''))+'</blockquote>';i++;continue;
    }
    if(/^\s*(?:-{3,}|\*{3,})\s*$/.test(line)){
      closeList();html+='<hr>';i++;continue;
    }
    if(/^\s*\|.*\|\s*$/.test(line)){
      closeList();
      const rows=[];
      while(i<lines.length&&/^\s*\|.*\|\s*$/.test(lines[i])){rows.push(lines[i]);i++;}
      const parseRow=r=>r.trim().replace(/^\|/,'').replace(/\|\s*$/,'').split('|').map(c=>c.trim());
      const header=parseRow(rows[0]);
      const sepOk=rows.length>1&&/^\s*\|?[\s:|-]+\|?\s*$/.test(rows[1]);
      html+='<table><thead><tr>'+header.map(h=>'<th>'+inline(h)+'</th>').join('')+'</tr></thead><tbody>';
      for(const r of (sepOk?rows.slice(2):rows.slice(1))){html+='<tr>'+parseRow(r).map(c=>'<td>'+inline(c)+'</td>').join('')+'</tr>';}
      html+='</tbody></table>';
      continue;
    }
    if(line.trim()===''){closeList();i++;continue;}
    closeList();
    html+='<p>'+inline(line)+'</p>';
    i++;
  }
  closeList();
  return html;
}
function showMd(el,text){el.innerHTML=mdRender(text);el.classList.remove('hidden');}
const MD_CSS='body{font-family:"Microsoft YaHei","PingFang SC",sans-serif;max-width:900px;margin:24px auto;padding:0 20px;color:#1f2328;line-height:1.75;font-size:14px}.print h1,.print h2{font-size:18px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid #eaeef2}.print h3{font-size:15px;margin:12px 0 6px}.print p{margin:6px 0}.print ul,.print ol{margin:6px 0;padding-left:24px}.print table{border-collapse:collapse;margin:8px 0;width:100%;font-size:13px}.print th,.print td{border:1px solid #d0d7de;padding:6px 10px;text-align:left}.print th{background:#f6f8fa}.print code{background:#eff1f3;border-radius:4px;padding:1px 5px;font-size:12px}.print pre.code{background:#0d1117;color:#c9d1d9;padding:12px;border-radius:8px;overflow:auto}.print blockquote{border-left:3px solid #d0d7de;margin:8px 0;padding:2px 12px;color:#57606a}.print hr{border:0;border-top:1px solid #eaeef2;margin:14px 0}.print a{color:#1f6feb}@media print{body{margin:0;padding:0}}';
let selMd=null,adMd=null,csMd=null;
function todayStr(){return new Date().toISOString().slice(0,10).replace(/-/g,'');}
function download(filename,content,mime){
  const blob=new Blob([content],{type:mime+';charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},200);
}
function exportMd(prefix,md){if(!md){toast('❌ 请先生成报告');return;}download(prefix+'_'+todayStr()+'.md',md,'text/markdown');}
function exportHtml(prefix,md){
  if(!md){toast('❌ 请先生成报告');return;}
  const html='<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>'+prefix+'</title><style>'+MD_CSS+'</style></head><body class="print">'+mdRender(md)+'</body></html>';
  download(prefix+'_'+todayStr()+'.html',html,'text/html');
}
function printReport(md){
  if(!md){toast('❌ 请先生成报告');return;}
  const w=window.open('','_blank');
  if(!w){toast('❌ 浏览器拦截了弹出窗口，请允许后重试');return;}
  w.document.write('<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>运营报告</title><style>'+MD_CSS+'</style></head><body class="print">'+mdRender(md)+'</body></html>');
  w.document.close();w.focus();
  setTimeout(()=>{try{w.print();}catch(e){toast('⚠️ 请在新窗口手动打印');}},400);
}
async function api(url,body){
  const opt={method:body?'POST':'GET',headers:{'Content-Type':'application/json'}};
  if(body)opt.body=JSON.stringify(body);
  const r=await fetch(url,opt);
  const j=await r.json().catch(()=>({detail:r.statusText}));
  if(!r.ok)throw new Error((j.detail||r.statusText)+'');
  if(j.code!==0)throw new Error(j.message||'unknown error');
  return j.data;
}
function setStatus(s){
  $('stVersion').textContent=s.version;
  $('stTbk').textContent=s.taobao_configured?'✅ 已配置':'❌ 未配置';
  $('stLLM').textContent=s.llm_configured?'✅ 已配置':'❌ 未配置';
}
async function run(loading,btn,fn){
  loading.classList.remove('hidden');btn.disabled=true;try{await fn();}catch(e){toast('❌ '+e.message);}finally{loading.classList.add('hidden');btn.disabled=false;}
}
$('btnSel').onclick=()=>run($('selLoading'),$('btnSel'),async()=>{
  const d=await api('/api/v1/selection/analyze',{category:$('selCategory').value.trim()||'无线蓝牙耳机',count:parseInt($('selCount').value)||20});
  selMd=`**【品类】** ${d.category}（真实数据 ${d.competitor_count} 款）｜闭环入库：${d.feedback_success?'✅ 成功':'未入库'}\n\n---\n\n${d.report}`;
  $('selExport').classList.remove('hidden');
  showMd($('selReport'),selMd);
});
$('btnAd').onclick=()=>run($('adLoading'),$('btnAd'),async()=>{
  const d=await api('/api/v1/ad/optimize',{top_n:parseInt($('adTopN').value)||15});
  const s=d.promotion_summary||{};
  adMd=`**【推广数据】** ${s.total??'-'} 款商品 ｜ 平均佣金 ${s.avg_commission??'-'}% ｜ 累计预估佣金 ¥${s.total_estimated_commission??'-'}\n\n---\n\n${d.strategy}`;
  $('adExport').classList.remove('hidden');
  showMd($('adReport'),adMd);
});
$('btnCs').onclick=()=>run($('csLoading'),$('btnCs'),async()=>{
  const content=$('csContent').value.trim();
  if(!content){toast('❌ 请先输入评论/私信内容');return;}
  const rating=parseInt($('csRating').value);
  const d=rating?await api('/api/v1/cs/review',{content,rating}):await api('/api/v1/cs/message',{content});
  csMd=`**【语言】** ${d.detected_language} ｜ 命中模板：${d.matched_template||'无'} ｜ 闭环：${d.feedback_success?'✅':'-'}\n\n---\n\n${d.reply}`;
  $('csExport').classList.remove('hidden');
  showMd($('csReport'),csMd);
});
$('btnLoop').onclick=()=>run($('loopLoading'),$('btnLoop'),async()=>{
  const d=await api('/api/v1/loop/stats',null);
  $('loopReport').textContent=JSON.stringify(d,null,2);$('loopReport').classList.remove('hidden');
});
$('selMdBtn').onclick=()=>exportMd('选品报告_'+($('selCategory').value.trim()||'无线蓝牙耳机'),selMd);
$('selHtmlBtn').onclick=()=>exportHtml('选品报告_'+($('selCategory').value.trim()||'无线蓝牙耳机'),selMd);
$('selPrintBtn').onclick=()=>printReport(selMd);
$('adMdBtn').onclick=()=>exportMd('投放优化方案',adMd);
$('adHtmlBtn').onclick=()=>exportHtml('投放优化方案',adMd);
$('adPrintBtn').onclick=()=>printReport(adMd);
$('csMdBtn').onclick=()=>exportMd('客服回复',csMd);
$('csHtmlBtn').onclick=()=>exportHtml('客服回复',csMd);
$('csPrintBtn').onclick=()=>printReport(csMd);
api('/api/v1/system/status',null).then(setStatus).catch(e=>toast('❌ 状态获取失败：'+e.message));
</script>
</body>
</html>
