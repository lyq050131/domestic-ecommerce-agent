services:
  app:
    build: .
    image: domestic-ecommerce-agent:latest
    container_name: domestic-ecommerce-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8000:8000"
    volumes:
      # ?????????/????/????
      - ./data:/app/data
      # ??????loguru ??????? 7 ?
      - ./logs:/app/logs
      # ????
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
